name: Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-screenshots:
    name: Generate store screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Render Compose previews
        run: .\gradlew.bat :shared:feature:device:dashboard:generateStoreScreenshots

      - name: Prepare screenshots for GitHub Pages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/store-screenshots | Out-Null
          @(
            'phone-1.png', 'phone-2.png', 'phone-3.png',
            'tablet-1.png', 'tablet-2.png', 'tablet-3.png'
          ) | ForEach-Object {
            Copy-Item -LiteralPath "docs/screenshots/$_" -Destination build/store-screenshots
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/store-screenshots

  publish-screenshots:
    name: Publish screenshots to GitHub Pages
    needs: store-screenshots
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: store-screenshots
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy screenshots
        id: deployment
        uses: actions/deploy-pages@v4
