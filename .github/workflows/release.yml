name: Release

on:
  release:
    types: [published] # Triggers when a new GitHub Release is created

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: exe
          - os: macos-latest
            format: dmg
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Package Desktop App
        shell: bash
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :desktopApp:packageDistributionForCurrentOS -PappVersionName=$VERSION_NAME -PappVersionCode=$VERSION_CODE
        
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/*/*.exe
            desktopApp/build/compose/binaries/main/*/*.msi
            desktopApp/build/compose/binaries/main/*/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Release Android to Play Store (Internal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout commerce module
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: drobekk/GeeFlow-Commerce
          ssh-key: ${{ secrets.COMMERCE_DEPLOY_KEY }}
          path: commerce

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > androidApp/keystore.jks

      - name: Build and Sign Release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :androidApp:bundleRelease \
          -PappVersionName=$VERSION_NAME \
          -PappVersionCode=$VERSION_CODE \
          -Pandroid.injected.signing.store.file=$PWD/androidApp/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
        
      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.geeflow
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed

  release-ios:
    name: Release iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout commerce module
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: drobekk/GeeFlow-Commerce
          ssh-key: ${{ secrets.COMMERCE_DEPLOY_KEY }}
          path: commerce

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Install Apple Certificate & Key
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: apple-actions/download-provisioning-profiles@v5
        with:
          bundle-id: 'app.geeflow'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Setup Provisioning Profile
        run: |
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            if [ -f "$f" ]; then
              UUID=$(security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)
              if [ -n "$UUID" ]; then
                echo "Using Provisioning Profile: $NAME ($UUID)"
                PROFILE_UUID="$UUID"
                echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
                break
              fi
            fi
          done

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Provisioning profile not found in ~/Library/MobileDevice/Provisioning Profiles/"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
            exit 1
          fi

      - name: Build and Archive iOS App
        run: |
          cd iosApp
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>6YSU8C88CY</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.geeflow</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphoneos \
            -configuration Release archive -archivePath $PWD/build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM=6YSU8C88CY \
            MARKETING_VERSION=$VERSION_NAME CURRENT_PROJECT_VERSION=$VERSION_CODE

          xcodebuild -exportArchive -archivePath $PWD/build/iosApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build

          find $PWD/build -name "*.ipa" -exec cp {} $PWD/build/GeeFlow.ipa \;

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'iosApp/build/GeeFlow.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
