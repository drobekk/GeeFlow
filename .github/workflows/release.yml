name: Release

on:
  release:
    types: [published] # Triggers when a new GitHub Release is created

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: exe
          - os: macos-latest
            format: dmg
          - os: ubuntu-latest
            format: deb
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Package Desktop App
        shell: bash
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :desktopApp:packageDistributionForCurrentOS -PappVersionName=$VERSION_NAME -PappVersionCode=$VERSION_CODE
        
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/*/*.exe
            desktopApp/build/compose/binaries/main/*/*.msi
            desktopApp/build/compose/binaries/main/*/*.dmg
            desktopApp/build/compose/binaries/main/*/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Release Android to Play Store (Internal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout commerce module
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: drobekk/GeeFlow-Commerce
          ssh-key: ${{ secrets.COMMERCE_DEPLOY_KEY }}
          path: commerce

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > androidApp/keystore.jks

      - name: Build and Sign Release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :androidApp:bundleRelease \
          -PappVersionName=$VERSION_NAME \
          -PappVersionCode=$VERSION_CODE \
          -Pandroid.injected.signing.store.file=$PWD/androidApp/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
        
      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.geeflow
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed

  release-ios:
    name: Release iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout commerce module
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: drobekk/GeeFlow-Commerce
          ssh-key: ${{ secrets.COMMERCE_DEPLOY_KEY }}
          path: commerce

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Configuring certificates..."
          
      - name: Build and Archive iOS App
        run: |
          cd iosApp
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          agvtool new-marketing-version $VERSION_NAME
          agvtool new-version -all $VERSION_CODE
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphoneos -configuration Release archive -archivePath $PWD/build/iosApp.xcarchive
          xcodebuild -exportArchive -archivePath $PWD/build/iosApp.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build
          
      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -f iosApp/build/iosApp.ipa -t ios -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD"
