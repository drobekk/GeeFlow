name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: exe
          - os: macos-latest
            format: dmg
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Package Desktop App
        shell: bash
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :desktopApp:packageDistributionForCurrentOS -PappVersionName=$VERSION_NAME -PappVersionCode=$VERSION_CODE
        
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/*/*.exe
            desktopApp/build/compose/binaries/main/*/*.msi
            desktopApp/build/compose/binaries/main/*/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Release Android to Play Store (Internal)
    runs-on: ubuntu-latest
    concurrency:
      group: play-store-app-geeflow
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > androidApp/keystore.jks

      - name: Build and Sign Release App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew :androidApp:bundleRelease \
          -PappVersionName=$VERSION_NAME \
          -PappVersionCode=$VERSION_CODE \
          -Pandroid.injected.signing.store.file=$PWD/androidApp/keystore.jks \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
        
      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.geeflow
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          tracks: internal
          status: completed

  release-ios:
    name: Release iOS to TestFlight
    runs-on: macos-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192M -XX:+UseParallelGC"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Install Apple Certificate & Key
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: apple-actions/download-provisioning-profiles@v5
        with:
          bundle-id: 'app.geeflow'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Build and Archive iOS App
        run: |
          cd iosApp
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=$GITHUB_RUN_NUMBER
          export VERSION_NAME
          export VERSION_CODE
          export MARKETING_VERSION=$VERSION_NAME
          export CURRENT_PROJECT_VERSION=$VERSION_CODE

          # Find the downloaded profile UUID
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            if [ -f "$f" ]; then
              UUID=$(security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)
              if [ -n "$UUID" ]; then
                PROFILE_UUID="$UUID"
                echo "Using Provisioning Profile: $NAME ($PROFILE_UUID)"
                break
              fi
            fi
          done

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Provisioning profile not found!"
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
            exit 1
          fi

          # Update ExportOptions.plist with manual signing and UUID
          plutil -replace signingStyle -string "manual" ExportOptions.plist
          plutil -remove provisioningProfiles ExportOptions.plist 2>/dev/null || true
          plutil -insert provisioningProfiles -xml "<dict><key>app.geeflow</key><string>$PROFILE_UUID</string></dict>" ExportOptions.plist

          # Build and Archive
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphoneos \
            -configuration Release archive -archivePath $PWD/build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM=6YSU8C88CY \
            MARKETING_VERSION=$VERSION_NAME CURRENT_PROJECT_VERSION=$VERSION_CODE

          # Export IPA
          xcodebuild -exportArchive -archivePath $PWD/build/iosApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath $PWD/build

          # Ensure GeeFlow.ipa exists
          find $PWD/build -name "*.ipa" -exec cp {} $PWD/build/GeeFlow.ipa \;

      - name: Prepare TestFlight Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            MSG=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"• %s" | head -n 25)
          else
            MSG=$(git log -10 --no-merges --pretty=format:"• %s")
          fi
          if [ -z "$MSG" ]; then
            MSG="Bug fixes and performance improvements."
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'iosApp/build/GeeFlow.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          release-notes: ${{ env.RELEASE_NOTES }}

  store-screenshots:
    name: Generate store screenshots
    needs: [release-desktop, release-android, release-ios]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Render Compose previews
        run: .\gradlew.bat :shared:feature:device:dashboard:generateStoreScreenshots

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            docs/screenshots/phone-*.png
            docs/screenshots/tablet-*.png

      - name: Upload screenshots to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/screenshots/phone-*.png
            docs/screenshots/tablet-*.png
