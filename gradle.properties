#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M -XX:+UseParallelGC -XX:+UseStringDeduplication
kotlin.daemon.jvm.options=-Xmx8192M
kotlin.native.jvm.options=-Xmx12288M -XX:+UseParallelGC -XX:+UseStringDeduplication
kotlin.native.jvmArgs=-Xmx12288M

#Gradle
org.gradle.jvmargs=-Xmx8192M -XX:+UseParallelGC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.native.ignoreDisabledTargets=true