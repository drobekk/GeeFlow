build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

output-reports:
  active: true

console-reports:
  active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions:
      - 'Preview'

style:
  MaxLineLength:
    maxLineLength: 130
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
      - 'GeeFlowScreenPreview'

formatting:
  active: true
  autoCorrect: true
  android: false
  MaximumLineLength:
    active: true
    maxLineLength: 130
